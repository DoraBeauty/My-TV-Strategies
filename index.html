<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人差旅費追蹤</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            font-size: 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            z-index: 1000;
        }
        .record-card {
            transition: transform 0.2s;
        }
        .record-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .thumbnail {
            max-width: 100px;
            max-height: 100px;
            object-fit: cover;
            cursor: pointer;
        }
        .status-settled {
            opacity: 0.7;
        }
        #dashboardView {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-wallet2 me-2"></i>差旅費追蹤</a>
            <div class="d-flex align-items-center">
                <span id="unsettledTotalText" class="text-white fw-bold me-3" style="display: none;">未入帳：$0</span>
                <button id="exportBtn" class="btn btn-sm btn-success me-2" style="display: none;">
                    <i class="bi bi-file-earmark-excel"></i> 匯出
                </button>
                <button id="loginBtn" class="btn btn-outline-light btn-sm">Google 登入</button>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm" style="display: none;">登出</button>
            </div>
        </div>
    </nav>

    <!-- Login View -->
    <div id="loginView" class="container mt-5 text-center">
        <div class="card shadow-sm mx-auto" style="max-width: 400px;">
            <div class="card-body py-5">
                <i class="bi bi-cloud-arrow-up text-primary" style="font-size: 4rem;"></i>
                <h3 class="mt-3 mb-4">歡迎使用</h3>
                <p class="text-muted mb-4">請使用 Google 帳號登入以記錄您的出差旅費。</p>
                <button id="largeLoginBtn" class="btn btn-primary btn-lg w-100">
                    <i class="bi bi-google me-2"></i> 使用 Google 登入
                </button>
            </div>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboardView" class="container mt-4 mb-5 pb-5">

        <!-- Filter / Stats Section -->
        <div class="row mb-3 align-items-center">
            <div class="col">
                <h5 class="mb-0">最近的紀錄</h5>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="text-center py-5" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">載入中...</p>
        </div>

        <!-- Records List -->
        <div id="recordsContainer" class="row g-3">
            <!-- Cards will be injected here by JS -->
        </div>

        <!-- FAB for new record -->
        <button class="btn btn-primary fab d-flex align-items-center justify-content-center" data-bs-toggle="modal" data-bs-target="#newRecordModal">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>

    <!-- New Record Modal -->
    <div class="modal fade" id="newRecordModal" tabindex="-1" aria-labelledby="newRecordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="newRecordModalLabel">新增出差紀錄</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="recordForm">

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label">出差地點/目的</label>
                            <input type="text" class="form-control" id="location" required placeholder="例如：台北分公司開會">
                        </div>

                        <!-- Time Range -->
                        <div class="row mb-3">
                            <div class="col-6">
                                <label for="startTime" class="form-label">開始時間</label>
                                <input type="datetime-local" class="form-control time-input" id="startTime" required>
                            </div>
                            <div class="col-6">
                                <label for="endTime" class="form-label">結束時間</label>
                                <input type="datetime-local" class="form-control time-input" id="endTime" required>
                            </div>
                        </div>

                        <!-- Allowance Output (Readonly) -->
                        <div class="mb-3">
                            <label class="form-label text-muted small mb-0">雜費試算 (依時數自動帶入)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">$</span>
                                <input type="number" class="form-control bg-light" id="allowance" readonly value="0">
                            </div>
                            <div id="timeCalcHint" class="form-text text-primary small">請先輸入起訖時間</div>
                        </div>

                        <hr>

                        <!-- Transport Selection -->
                        <div class="mb-3">
                            <label for="transportType" class="form-label">交通方式</label>
                            <select class="form-select" id="transportType" required>
                                <option value="" disabled selected>請選擇...</option>
                                <option value="car">自行開車</option>
                                <option value="motorcycle">自行騎機車</option>
                                <option value="public">高鐵/火車/大眾運輸</option>
                            </select>
                        </div>

                        <!-- Dynamic Inputs for Transport -->
                        <div id="mileageSection" class="mb-3" style="display: none;">
                            <label for="mileage" class="form-label">里程數 (公里)</label>
                            <input type="number" class="form-control calc-input" id="mileage" min="0" step="0.1" placeholder="輸入公里數">
                            <div id="mileageRateHint" class="form-text small"></div>
                        </div>

                        <div id="publicTransportSection" style="display: none;">
                            <div class="mb-3">
                                <label for="ticketPrice" class="form-label">實際票價</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control calc-input" id="ticketPrice" min="0" placeholder="輸入金額">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="receiptImage" class="form-label">上傳票根照片</label>
                                <input class="form-control" type="file" id="receiptImage" accept="image/*">
                            </div>
                        </div>

                        <!-- Total Output (Readonly) -->
                        <div class="mb-3 mt-4 pt-3 border-top">
                            <label class="form-label fw-bold mb-0">總計金額 (雜費 + 交通費)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text text-danger fw-bold">$</span>
                                <input type="number" class="form-control text-danger fw-bold bg-white" id="totalAmount" readonly value="0">
                            </div>
                        </div>

                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveRecordBtn">
                        <span class="spinner-border spinner-border-sm me-1 d-none" id="saveSpinner" role="status" aria-hidden="true"></span>
                        儲存紀錄
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Logic -->
    <script type="module" src="./app.js"></script>
</body>
</html>
