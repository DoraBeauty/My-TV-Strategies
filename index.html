<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨平台限免遊戲追蹤</title>

    <!-- PWA & 主畫面圖示設定 -->
    <link rel="icon" type="image/jpeg" href="icon.jpg">
    <link rel="apple-touch-icon" href="icon.jpg">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#171d25">

    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        steam: {
                            bg: '#171d25',          /* Steam 整體背景深藍黑 */
                            header: '#171a21',      /* 頂部導覽列色 */
                            card: '#202d39',        /* 卡片底色，比背景稍亮 */
                            text: '#c7d5e0',        /* 主要文字色 (淡灰藍) */
                            highlight: '#66c0f4',   /* 強調文字色 (亮藍) */
                            btnNormal: '#2a475e',   /* 按鈕漸層起始 (深藍) */
                            btnHover: '#66c0f4',    /* 按鈕懸停 (亮藍) */
                            green: '#a4d007'        /* 價格標籤綠色 */
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .hidden-game {
            display: none !important;
        }
    </style>
</head>
<body class="bg-steam-bg text-steam-text font-sans antialiased min-h-screen flex flex-col">

    <!-- 導覽列 -->
    <header class="bg-steam-header shadow-md">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center">
            <h1 class="text-2xl font-bold text-white mb-4 md:mb-0">
                <span class="text-steam-highlight">跨平台</span> 限免遊戲追蹤
            </h1>

            <div class="flex flex-col md:flex-row items-center gap-4">
                <!-- 排序篩選 -->
                <div class="flex items-center space-x-2 bg-steam-card px-3 py-2 rounded-lg">
                    <span class="text-sm">排序：</span>
                    <select id="sortFilter" class="bg-steam-header text-white text-sm rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-steam-highlight">
                        <option value="default">預設</option>
                        <option value="savings">原價最高</option>
                        <option value="rating">評價最高</option>
                    </select>
                </div>

                <!-- 商店篩選 -->
                <div class="flex items-center space-x-2 bg-steam-card px-3 py-2 rounded-lg">
                    <span class="text-sm">商店：</span>
                    <select id="storeFilter" class="bg-steam-header text-white text-sm rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-steam-highlight">
                        <option value="all">全部</option>
                        <option value="1">僅 Steam</option>
                        <option value="25">僅 Epic</option>
                    </select>
                </div>

                <!-- 開關 Toggle -->
                <div id="toggleContainer" class="flex items-center space-x-3 bg-steam-card px-4 py-2 rounded-lg hidden">
                    <span class="text-sm">顯示永久免費遊戲</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="showFreeGamesToggle" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-steam-highlight"></div>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容 -->
    <main class="container mx-auto px-4 py-8 flex-grow">

        <!-- 狀態提示區 (Loading, Error, Empty) -->
        <div id="statusArea" class="max-w-2xl mx-auto mt-8">
            <!-- 骨架屏載入動畫 (Skeleton Loading) -->
            <div id="loadingMsg" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 w-full max-w-7xl mx-auto">
                <!-- 產生 8 個骨架卡片 -->
                <script>
                    for(let i=0; i<8; i++){
                        document.write(`
                            <div class="bg-steam-card rounded-lg overflow-hidden shadow-lg animate-pulse h-80 flex flex-col">
                                <div class="h-48 w-full bg-gray-700"></div>
                                <div class="p-4 flex flex-col flex-grow">
                                    <div class="h-6 bg-gray-700 rounded w-3/4 mb-4"></div>
                                    <div class="mt-auto flex justify-between items-end">
                                        <div>
                                            <div class="h-3 bg-gray-700 rounded w-8 mb-2"></div>
                                            <div class="h-4 bg-gray-700 rounded w-12"></div>
                                        </div>
                                        <div class="h-8 bg-gray-700 rounded w-20"></div>
                                    </div>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>

            <!-- Error -->
            <div id="errorMsg" class="hidden bg-red-900/50 border border-red-500 text-red-200 px-6 py-4 rounded-lg text-center">
                <p class="text-lg">無法獲取限免遊戲清單，請稍後再試。</p>
            </div>

            <!-- Empty (No Games from API at all) -->
            <div id="emptyMsg" class="hidden bg-steam-card border border-steam-btnNormal px-6 py-8 rounded-lg text-center">
                <p class="text-xl text-steam-highlight mb-2">目前尚無免費遊戲</p>
                <p class="text-steam-text">請稍後再來查看最新限免資訊！</p>
            </div>
        </div>

        <!-- 遊戲卡片網格 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden" id="gamesGrid">
            <!-- 卡片會由 JS 動態生成插入於此 -->
        </div>

        <!-- 當所有卡片都被 Toggle 隱藏時的提示 -->
        <div id="noVisibleGamesMessage" class="hidden bg-steam-card border border-steam-btnNormal px-6 py-8 rounded-lg text-center max-w-2xl mx-auto mt-8">
            <p class="text-xl text-steam-highlight mb-2">目前沒有限時免費遊戲</p>
            <p class="text-steam-text">你可以打開右上角的開關，查看永久免費的遊戲。</p>
        </div>

    </main>

    <footer class="bg-steam-header py-6 mt-auto">
        <div class="container mx-auto px-4 text-center text-sm text-gray-500">
            <p>資料來源：<a href="https://apidocs.cheapshark.com/" target="_blank" class="hover:text-white transition-colors">CheapShark API</a></p>
            <p class="mt-1">非各平台官方網站，僅供資訊參考使用。</p>
        </div>
    </footer>

    <!-- 邏輯控制腳本 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let globalGamesData = []; // 保存原始資料供排序使用

            const sortFilter = document.getElementById('sortFilter');
            const toggle = document.getElementById('showFreeGamesToggle');
            const storeFilter = document.getElementById('storeFilter');
            const gamesGrid = document.getElementById('gamesGrid');
            const statusArea = document.getElementById('statusArea');
            const loadingMsg = document.getElementById('loadingMsg');
            const errorMsg = document.getElementById('errorMsg');
            const emptyMsg = document.getElementById('emptyMsg');
            const noVisibleMsg = document.getElementById('noVisibleGamesMessage');

            // 抓取資料
            fetch('https://www.cheapshark.com/api/1.0/deals?storeID=1,25&upperPrice=0')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    loadingMsg.classList.add('hidden');

                    if (data && data.length > 0) {
                        globalGamesData = data; // 保存資料
                        renderGames(globalGamesData);

                        // 檢查是否有任何永久免費遊戲，如果有的話才顯示 Toggle
                        const hasPermanentFree = data.some(game => parseFloat(game.normalPrice) === 0.0);
                        if (hasPermanentFree) {
                            document.getElementById('toggleContainer').classList.remove('hidden');
                        }

                        gamesGrid.classList.remove('hidden');
                        updateVisibility(); // 初始化檢查一次 Toggle 狀態
                    } else {
                        emptyMsg.classList.remove('hidden');
                    }
                })
                .catch(error => {
                    console.error('Fetch Error:', error);
                    loadingMsg.classList.add('hidden');
                    errorMsg.classList.remove('hidden');
                });

            // 翻譯 Steam 評價
            function translateSteamRating(ratingText) {
                if (!ratingText) return null;
                const dict = {
                    "Overwhelmingly Positive": "壓倒性好評",
                    "Very Positive": "極度好評",
                    "Positive": "好評",
                    "Mostly Positive": "大多好評",
                    "Mixed": "褒貶不一",
                    "Mostly Negative": "大多負評",
                    "Negative": "負評",
                    "Very Negative": "極度負評",
                    "Overwhelmingly Negative": "壓倒性負評"
                };
                return dict[ratingText] || ratingText;
            }

            // 渲染遊戲卡片
            function renderGames(games) {
                gamesGrid.innerHTML = ''; // 清空

                games.forEach(game => {
                    const normalPrice = parseFloat(game.normalPrice);
                    const isPermanentFree = (normalPrice === 0.0);
                    const tagText = isPermanentFree ? '免費' : '100% OFF';
                    const dataPermanentFree = isPermanentFree ? 'true' : 'false';
                    const storeID = game.storeID;

                    let storeBadgeHTML = '';
                    if (storeID === '1') {
                        storeBadgeHTML = `<div class="absolute top-2 left-2 bg-[#1b2838] text-white text-xs font-bold px-2 py-1 rounded shadow-md border border-[#2a475e]">Steam</div>`;
                    } else if (storeID === '25') {
                        storeBadgeHTML = `<div class="absolute top-2 left-2 bg-[#313131] text-white text-xs font-bold px-2 py-1 rounded shadow-md border border-[#4a4a4a]">Epic</div>`;
                    }

                    const cardHTML = `
                        <div class="game-card bg-steam-card rounded-lg overflow-hidden shadow-lg transition-transform duration-300 hover:-translate-y-1 hover:shadow-2xl flex flex-col"
                             data-permanent-free="${dataPermanentFree}" data-store-id="${storeID}">

                            <div class="relative h-48 w-full bg-black">
                                <img src="${game.thumb}" alt="${game.title} 封面" class="w-full h-full object-cover">
                                ${storeBadgeHTML}
                                <div class="absolute top-2 right-2 bg-steam-green text-[#000000] font-bold px-2 py-1 rounded text-sm shadow-md">
                                    ${tagText}
                                </div>
                            </div>

                            <div class="p-4 flex flex-col flex-grow">
                                <h2 class="text-lg font-bold text-white mb-2 line-clamp-2" title="${game.title}">${game.title}</h2>

                                <!-- 評價區塊 -->
                                <div class="mb-3">
                                    ${
                                        (game.steamRatingPercent && game.steamRatingPercent !== "0" && game.steamRatingText)
                                        ? `<span class="inline-flex items-center space-x-1 text-xs px-2 py-1 rounded bg-[#1b2838] border border-[#2a475e]">
                                             <span class="${parseInt(game.steamRatingPercent) >= 70 ? 'text-[#66c0f4]' : (parseInt(game.steamRatingPercent) >= 40 ? 'text-yellow-500' : 'text-red-500')} font-medium">
                                                ${translateSteamRating(game.steamRatingText)}
                                             </span>
                                             <span class="text-gray-400">(${game.steamRatingPercent}%)</span>
                                           </span>`
                                        : `<span class="inline-flex text-xs px-2 py-1 rounded bg-gray-800 text-gray-500 border border-gray-700">無評價資料</span>`
                                    }
                                </div>

                                <div class="mt-auto pt-4 flex items-end justify-between border-t border-gray-700">
                                    <div>
                                        <p class="text-xs text-gray-400 mb-1">原價</p>
                                        <p class="text-sm text-gray-500 line-through bg-gray-800 px-2 py-0.5 rounded inline-block">
                                            $${game.normalPrice}
                                        </p>
                                    </div>

                                    <a href="https://www.cheapshark.com/redirect?dealID=${game.dealID}"
                                       target="_blank"
                                       rel="noopener noreferrer"
                                       class="bg-gradient-to-r from-steam-btnNormal to-steam-btnHover hover:from-steam-btnHover hover:to-blue-400 text-white font-medium px-4 py-2 rounded transition-colors duration-200 text-sm whitespace-nowrap ml-2">
                                        前往領取
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                    gamesGrid.insertAdjacentHTML('beforeend', cardHTML);
                });
            }

            // 更新顯示狀態 (Toggle 邏輯)
            function updateVisibility() {
                const gameCards = document.querySelectorAll('.game-card');
                if (gameCards.length === 0) return; // 還沒資料時不處理

                const showPermanentFree = toggle.checked;
                const selectedStore = storeFilter.value;
                let visibleCount = 0;

                gameCards.forEach(card => {
                    const isPermanentFree = card.getAttribute('data-permanent-free') === 'true';
                    const storeID = card.getAttribute('data-store-id');

                    let isVisible = true;

                    if (isPermanentFree && !showPermanentFree) {
                        isVisible = false;
                    }

                    if (selectedStore !== 'all' && storeID !== selectedStore) {
                        isVisible = false;
                    }

                    if (!isVisible) {
                        card.classList.add('hidden-game');
                    } else {
                        card.classList.remove('hidden-game');
                        visibleCount++;
                    }
                });

                if (visibleCount === 0) {
                    noVisibleMsg.classList.remove('hidden');
                } else {
                    noVisibleMsg.classList.add('hidden');
                }
            }

            // 處理排序邏輯
            function handleSort() {
                const sortType = sortFilter.value;
                let sortedData = [...globalGamesData]; // 複製一份陣列

                if (sortType === 'savings') {
                    // 原價最高 (因為現在全免費，所以 normalPrice 越高代表省越多)
                    sortedData.sort((a, b) => parseFloat(b.normalPrice) - parseFloat(a.normalPrice));
                } else if (sortType === 'rating') {
                    // 評價最高 (steamRatingPercent)
                    sortedData.sort((a, b) => {
                        const ratingA = parseInt(a.steamRatingPercent) || 0;
                        const ratingB = parseInt(b.steamRatingPercent) || 0;
                        return ratingB - ratingA;
                    });
                }

                renderGames(sortedData);
                updateVisibility(); // 重新渲染後需要再次套用過濾條件
            }

            // 監聽變化
            sortFilter.addEventListener('change', handleSort);
            toggle.addEventListener('change', updateVisibility);
            storeFilter.addEventListener('change', updateVisibility);
        });
    </script>
</body>
</html>
